version: '3.8'

services:
  # Local collection mode: stores data in ./data/ directory
  collector-local:
    build: .
    container_name: ibkr-collector-local
    command: >
      --dry-run
      --log-json
    volumes:
      - ./data:/tmp/ibkr-data
      - baseline-cache:/home/collector/.ibkr-baselines
    profiles:
      - local

  # AWS collection mode: uploads to S3
  collector-aws:
    build: .
    container_name: ibkr-collector-aws
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET}
    command: >
      --s3-bucket ${S3_BUCKET}
      --s3-prefix ibkr/borrow
      --log-json
    volumes:
      - baseline-cache:/home/collector/.ibkr-baselines
    profiles:
      - aws

volumes:
  baseline-cache:
