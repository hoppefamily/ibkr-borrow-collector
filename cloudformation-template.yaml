AWSTemplateFormatVersion: '2010-09-09'
Description: 'IBKR Borrow Collector - S3 bucket and IAM resources for storing borrow rate data with delta compression'

Parameters:
  BucketName:
    Type: String
    Description: 'Name for the S3 bucket (leave empty for auto-generated name)'
    Default: ''
    AllowedPattern: '^[a-z0-9.-]*$'
    ConstraintDescription: 'Bucket name must contain only lowercase letters, numbers, dots, and hyphens'

  UseOIDC:
    Type: String
    Description: 'Use OIDC for GitHub Actions authentication (recommended) instead of access keys'
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  GitHubRepository:
    Type: String
    Description: 'GitHub repository in format owner/repo (required if UseOIDC is true)'
    Default: 'hoppefamily/ibkr-borrow-collector'

  DataRetentionDays:
    Type: Number
    Description: 'Number of days to retain borrow data (0 = never expire)'
    Default: 365
    MinValue: 0
    MaxValue: 3650

  TransitionToGlacierDays:
    Type: Number
    Description: 'Number of days before transitioning to Glacier (0 = disabled, must be >= 30)'
    Default: 90
    MinValue: 0
    MaxValue: 365

Conditions:
  HasBucketName: !Not [!Equals [!Ref BucketName, '']]
  EnableExpiration: !Not [!Equals [!Ref DataRetentionDays, 0]]
  EnableGlacierTransition: !Not [!Equals [!Ref TransitionToGlacierDays, 0]]
  UseOIDCAuth: !Equals [!Ref UseOIDC, 'true']
  UseAccessKeys: !Not [!Condition UseOIDCAuth]

Resources:
  # S3 Bucket for storing borrow rate data
  BorrowDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If [HasBucketName, !Ref BucketName, !Ref 'AWS::NoValue']
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # Transition baselines to Intelligent-Tiering after 30 days
          - Id: IntelligentTieringForBaselines
            Status: Enabled
            Prefix: 'ibkr/borrow/'
            Transitions:
              - TransitionInDays: 30
                StorageClass: INTELLIGENT_TIERING
            NoncurrentVersionExpirationInDays: 1

          # Optional: Transition to Glacier for long-term archival
          - Id: GlacierTransition
            Status: !If [EnableGlacierTransition, Enabled, Disabled]
            Prefix: 'ibkr/borrow/'
            Transitions:
              - TransitionInDays: !Ref TransitionToGlacierDays
                StorageClass: GLACIER_IR

          # Optional: Expire old data
          - Id: DataExpiration
            Status: !If [EnableExpiration, Enabled, Disabled]
            Prefix: 'ibkr/borrow/'
            ExpirationInDays: !Ref DataRetentionDays
            NoncurrentVersionExpirationInDays: 1

          # Delete incomplete multipart uploads after 7 days
          - Id: CleanupIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Application
          Value: IBKR-Borrow-Collector
        - Key: Purpose
          Value: Short borrow rate data storage
        - Key: DataType
          Value: Financial market data

  # IAM User for GitHub Actions
  GitHubActionsUser:
    Type: AWS::IAM::User
    Condition: UseAccessKeys
    Properties:
      UserName: !Sub '${AWS::StackName}-github-actions'
      Tags:
        - Key: Application
          Value: IBKR-Borrow-Collector
        - Key: Purpose
          Value: GitHub Actions CI/CD

  # IAM Policy for S3 Access
  CollectorS3Policy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${AWS::StackName}-s3-access'
      Description: 'Allows IBKR borrow collector to read/write S3 data'
      Users: !If
        - UseAccessKeys
        - [!Ref GitHubActionsUser]
        - !Ref AWS::NoValue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Full access to borrow data prefix
          - Sid: BorrowDataAccess
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:PutObjectAcl
              - s3:GetObject
              - s3:GetObjectAcl
              - s3:DeleteObject
              - s3:ListBucket
            Resource:
              - !Sub '${BorrowDataBucket.Arn}/ibkr/borrow/*'
              - !GetAtt BorrowDataBucket.Arn

          # List bucket to find latest snapshots
          - Sid: ListBucket
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !GetAtt BorrowDataBucket.Arn
            Condition:
              StringLike:
                s3:prefix:
                  - 'ibkr/borrow/*'

  # IAM Access Keys for GitHub Actions (legacy method)
  GitHubActionsAccessKey:
    Type: AWS::IAM::AccessKey
    Condition: UseAccessKeys
    Properties:
      UserName: !Ref GitHubActionsUser

  # GitHub OIDC Provider (for OIDC authentication)
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: UseOIDCAuth
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: Application
          Value: IBKR-Borrow-Collector

  # IAM Role for GitHub Actions OIDC
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Condition: UseOIDCAuth
    Properties:
      RoleName: !Sub '${AWS::StackName}-github-actions-role'
      Description: 'Role for GitHub Actions to assume via OIDC'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': 'sts.amazonaws.com'
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubRepository}:*'
      ManagedPolicyArns:
        - !Ref CollectorS3Policy
      Tags:
        - Key: Application
          Value: IBKR-Borrow-Collector
        - Key: Purpose
          Value: GitHub Actions OIDC

  # IAM Role for Lambda (optional, if using Lambda deployment)
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref CollectorS3Policy
      Tags:
        - Key: Application
          Value: IBKR-Borrow-Collector
        - Key: Purpose
          Value: Lambda execution role

  # IAM Role for ECS Task (optional, if using ECS deployment)
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ecs-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Application
          Value: IBKR-Borrow-Collector

  # IAM Role for ECS Task
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ecs-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref CollectorS3Policy
      Tags:
        - Key: Application
          Value: IBKR-Borrow-Collector

  # Secrets Manager secret for storing access keys (legacy method only)
  GitHubActionsCredentials:
    Type: AWS::SecretsManager::Secret
    Condition: UseAccessKeys
    Properties:
      Name: !Sub '${AWS::StackName}/github-actions-credentials'
      Description: 'AWS credentials for GitHub Actions IBKR borrow collector'
      SecretString: !Sub |
        {
          "AWS_ACCESS_KEY_ID": "${GitHubActionsAccessKey}",
          "AWS_SECRET_ACCESS_KEY": "${GitHubActionsAccessKey.SecretAccessKey}",
          "AWS_REGION": "${AWS::Region}",
          "S3_BUCKET": "${BorrowDataBucket}"
        }
      Tags:
        - Key: Application
          Value: IBKR-Borrow-Collector

Outputs:
  BucketName:
    Description: 'Name of the S3 bucket for borrow data'
    Value: !Ref BorrowDataBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  BucketArn:
    Description: 'ARN of the S3 bucket'
    Value: !GetAtt BorrowDataBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BucketArn'

  GitHubActionsUserArn:
    Description: 'ARN of the IAM user for GitHub Actions (legacy method only)'
    Condition: UseAccessKeys
    Value: !GetAtt GitHubActionsUser.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GitHubActionsUserArn'

  AccessKeyId:
    Description: 'AWS Access Key ID for GitHub Actions (legacy method only)'
    Condition: UseAccessKeys
    Value: !Ref GitHubActionsAccessKey

  SecretAccessKey:
    Description: 'AWS Secret Access Key for GitHub Actions (legacy method only) - SAVE THIS NOW!'
    Condition: UseAccessKeys
    Value: !GetAtt GitHubActionsAccessKey.SecretAccessKey

  CredentialsSecretArn:
    Description: 'ARN of Secrets Manager secret containing credentials (legacy method only)'
    Condition: UseAccessKeys
    Value: !Ref GitHubActionsCredentials
    Export:
      Name: !Sub '${AWS::StackName}-CredentialsSecretArn'

  LambdaRoleArn:
    Description: 'ARN of IAM role for Lambda execution (if using Lambda deployment)'
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaRoleArn'

  ECSTaskExecutionRoleArn:
    Description: 'ARN of IAM role for ECS task execution (if using ECS deployment)'
    Value: !GetAtt ECSTaskExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ECSTaskExecutionRoleArn'

  ECSTaskRoleArn:
    Description: 'ARN of IAM role for ECS task (if using ECS deployment)'
    Value: !GetAtt ECSTaskRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ECSTaskRoleArn'

  Region:
    Description: 'AWS Region where resources were created'
    Value: !Ref 'AWS::Region'

  GitHubSecretsInstructions:
    Description: 'Instructions for configuring GitHub Secrets'
    Value: !If
      - UseOIDCAuth
      - !Sub |
          OIDC Authentication (Recommended)
          =====================================
          Add these secrets to your GitHub repository (Settings → Secrets → Actions):

          AWS_ROLE_ARN: ${GitHubActionsRole.Arn}
          AWS_REGION: ${AWS::Region}
          S3_BUCKET: ${BorrowDataBucket}

          No access keys needed! GitHub Actions will authenticate via OIDC.
      - !Sub |
          Access Key Authentication (Legacy)
          ===================================
          Add these secrets to your GitHub repository (Settings → Secrets → Actions):

          AWS_ACCESS_KEY_ID: ${GitHubActionsAccessKey}
          AWS_SECRET_ACCESS_KEY: ${GitHubActionsAccessKey.SecretAccessKey}
          AWS_REGION: ${AWS::Region}
          S3_BUCKET: ${BorrowDataBucket}
