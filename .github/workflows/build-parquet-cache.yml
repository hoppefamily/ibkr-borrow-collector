name: Build Parquet Cache

on:
  schedule:
    # Run daily at 00:30 UTC (after first collection run of the day)
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode: single (one date), missing (all missing), range (date range)'
        required: false
        type: choice
        options:
          - single
          - missing
          - range
        default: missing
      date:
        description: 'Date for single mode (YYYY-MM-DD, leave empty for yesterday)'
        required: false
        type: string
      start_date:
        description: 'Start date for range mode (YYYY-MM-DD)'
        required: false
        type: string
      end_date:
        description: 'End date for range mode (YYYY-MM-DD)'
        required: false
        type: string
      days_back:
        description: 'For missing mode: how many days back to check (default: 30)'
        required: false
        type: number
        default: 30
      force:
        description: 'Force rebuild even if cache exists'
        required: false
        type: boolean
        default: false

# Prevent concurrent cache building to avoid race conditions and AWS credential conflicts
concurrency:
  group: parquet-cache-builder
  cancel-in-progress: false

# Required for OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  build-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xdelta3

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Configure AWS credentials via OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActions-ParquetCache

      - name: Build Parquet caches
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          MARKETS="usa germany british swiss dutch france italy spain austria belgium hongkong japan swedish australia canada mexico india singapore"
          MODE="${{ inputs.mode }}"
          MODE="${MODE:-missing}"  # Default to missing mode

          echo "=========================================="
          echo "Build Mode: $MODE"
          echo "=========================================="

          if [ "$MODE" = "single" ]; then
            # Single date mode
            if [ -n "${{ inputs.date }}" ]; then
              TARGET_DATE="${{ inputs.date }}"
            else
              TARGET_DATE=$(date -u -d yesterday +%Y-%m-%d)
            fi

            echo "Building caches for date: $TARGET_DATE"

            for MARKET in $MARKETS; do
              echo "Building cache for market: $MARKET"
              python build_parquet_cache.py \
                --date $TARGET_DATE \
                --market $MARKET \
                --bucket $S3_BUCKET \
                $FORCE_FLAG || echo "⚠️  Failed to build cache for $MARKET"
            done

          elif [ "$MODE" = "range" ]; then
            # Date range mode
            START_DATE="${{ inputs.start_date }}"
            END_DATE="${{ inputs.end_date }}"

            if [ -z "$START_DATE" ] || [ -z "$END_DATE" ]; then
              echo "❌ Error: start_date and end_date required for range mode"
              exit 1
            fi

            echo "Building caches for range: $START_DATE to $END_DATE"

            for MARKET in $MARKETS; do
              echo ""
              echo "Building cache for market: $MARKET ($START_DATE to $END_DATE)"
              python build_parquet_cache.py \
                --start $START_DATE \
                --end $END_DATE \
                --market $MARKET \
                --bucket $S3_BUCKET \
                $FORCE_FLAG || echo "⚠️  Failed to build cache for $MARKET"
            done

          else
            # Missing mode (default) - build all missing caches efficiently
            DAYS_BACK="${{ inputs.days_back }}"
            DAYS_BACK="${DAYS_BACK:-30}"

            echo "Building missing caches for last $DAYS_BACK days (efficient batch check)"

            for MARKET in $MARKETS; do
              echo ""
              echo "=== $MARKET ==="

              # Use --missing flag for efficient batch checking (2 S3 list ops instead of N head ops)
              python build_parquet_cache.py \
                --missing $DAYS_BACK \
                --market $MARKET \
                --bucket $S3_BUCKET \
                $FORCE_FLAG || echo "⚠️  Failed to build cache for $MARKET"
            done
          fi

      - name: Summary
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          echo ""
          echo "=========================================="
          echo "CACHE SUMMARY"
          echo "=========================================="

          MARKETS="usa germany british swiss dutch france italy spain austria belgium hongkong japan swedish australia canada mexico india singapore"

          for MARKET in $MARKETS; do
            COUNT=$(aws s3 ls "s3://${S3_BUCKET}/ibkr/parquet/${MARKET}/" --recursive | wc -l)
            echo "$MARKET: $COUNT parquet files"
          done

      - name: List recent caches
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          echo "Recent Parquet caches by market:"
          for MARKET in usa germany british swiss dutch france italy spain austria belgium hongkong japan swedish australia canada mexico india singapore; do
            echo ""
            echo "=== $MARKET ==="
            aws s3 ls "s3://${S3_BUCKET}/ibkr/parquet/${MARKET}/" --recursive --human-readable | tail -5 || echo "No caches found"
          done
