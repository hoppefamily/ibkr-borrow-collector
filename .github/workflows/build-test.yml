name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

      # The scheduled jobs run these as scripts, so a syntax or import error
      # would otherwise only surface on the next cron tick.
      - name: Check entry points import
        run: |
          set -euxo pipefail
          python -c "import collector"
          python -c "import build_parquet_cache"
          python -c "import export_symbols"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # collect.yml builds this image every 15 minutes; catch a broken
      # Dockerfile here rather than in a collection run.
      - name: Build collector image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ibkr-collector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: docker run --rm ibkr-collector:ci --help
