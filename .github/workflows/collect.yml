name: Collect IBKR Borrow Data

on:
  schedule:
    # Run every 15 minutes, 24/7 (global markets, some trade on weekends)
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Allow manual trigger

# Prevent concurrent collection runs to avoid race conditions
concurrency:
  group: ibkr-collector
  cancel-in-progress: false

# Required for OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS credentials via OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActions-IBKRCollector

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build collector container
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ibkr-collector:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run collector
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            ibkr-collector:latest \
            --s3-bucket "$S3_BUCKET" \
            --s3-prefix "ibkr/borrow" \
            --log-json

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collector-logs
          path: |
            *.log
            *.json
          retention-days: 7
