name: Collect IBKR Borrow Data

on:
  schedule:
    # Run every 15 minutes during market hours (approx 6 AM - 8 PM ET = 11 AM - 1 AM UTC)
    - cron: '*/15 11-23 * * 1-5'
    - cron: '*/15 0-1 * * 2-6'
  workflow_dispatch:  # Allow manual trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build collector container
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ibkr-collector:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run collector
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_DEFAULT_REGION \
            ibkr-collector:latest \
            --s3-bucket "$S3_BUCKET" \
            --s3-prefix "ibkr/borrow" \
            --log-json

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collector-logs
          path: |
            *.log
            *.json
          retention-days: 7
